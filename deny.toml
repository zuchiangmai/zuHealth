# cargo deny check licenses: every dependency must allow distributing the app under MIT. No copyleft licences:
# GPL and LGPL are not allowed, so one can't slip in with a new dependency.
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0", "0BSD",
]
confidence-threshold = 0.9
# Per-crate exceptions, each permissive (decision 53):
# - sqlcipher-src bundles SQLite (public-domain "blessing") and parts under WTFPL
# - webpki-root-certs (via ureq's platform verifier, health-connect only): CDLA-Permissive-2.0 certificate data
# - webpki-roots (ureq's bundled roots, health-connect on Android only): the same CDLA-Permissive-2.0 data
exceptions = [
  { crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] },
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]
