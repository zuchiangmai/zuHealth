[package]
name = "health-connect"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "The only crate that opens network connections (plan §2.2): component downloads, the health backend, LAN sync (WebRTC)"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
sha2 = "0.11"
hex = "0.4"
serde_json = "1"
str0m = { version = "0.26", default-features = false, features = ["rust-crypto"] }
if-addrs = "0.15"

# Android: bundled root certificates (see `roots()` in lib.rs)
[target.'cfg(target_os = "android")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
