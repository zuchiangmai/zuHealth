[package]
name = "health-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.23.1"
chrono = "0.4.45"
hex = "0.4.3"
hkdf = "0.13.0"
pbkdf2 = "0.13.0"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher-vendored-openssl", "serde_json"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.3", features = ["v7"] }
regex = "1"
zeroize = "1.9.2"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher-vendored-openssl"] }
tempfile = "3.27.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
