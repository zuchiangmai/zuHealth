[package]
name = "health-ocr"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Lab report OCR: detection, recognition, table layout, measure matching (port of the web ocr/)"

[dependencies]
health-core = { path = "../health-core" }
tract-onnx = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif"] }
hayro = "0.9"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
fancy-regex = "0.14"
regex = "1"
unicode-normalization = "0.1"
sha2 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
crc32fast = "1"
