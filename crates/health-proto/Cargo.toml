[package]
name = "health-proto"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "The health backend protocol: account keys, signed requests, HPKE, link and identity codes, result checks. Pure: no network, no clock."

[dependencies]
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
